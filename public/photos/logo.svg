<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="guardei — polaroid">
  <defs>
    <filter id="grain02" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.2  0 0 0 0 0.14  0 0 0 0 0.08  0 0 0 0.4 0"></feColorMatrix>
      <feComposite in2="SourceGraphic" operator="in"></feComposite>
    </filter>
    <radialGradient id="photo02" cx="35%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#e9d4ad"></stop>
      <stop offset="55%" stop-color="#b89968"></stop>
      <stop offset="100%" stop-color="#8a6f44"></stop>
    </radialGradient>
  </defs>

  
  <g transform="translate(120 122) rotate(-5) translate(-90 -100)">
    
    <rect x="6" y="10" width="180" height="200" rx="3" fill="#000" opacity="0.18"></rect>
    
    <rect x="0" y="0" width="180" height="200" rx="3" fill="#faf6ec"></rect>
    <rect x="0" y="0" width="180" height="200" rx="3" fill="#000" filter="url(#grain02)" opacity="0.18"></rect>
    
    <rect x="14" y="14" width="152" height="138" fill="url(#photo02)"></rect>
    
    <rect x="14" y="14" width="152" height="138" fill="#000" filter="url(#grain02)" opacity="0.5"></rect>
    
    <text x="90" y="120" text-anchor="middle" font-family="DM Serif Display, Georgia, serif" font-size="118" font-style="italic" fill="#2a1f14" letter-spacing="-4">g</text>
    
    <text x="90" y="183" text-anchor="middle" font-family="Caveat, cursive" font-size="22" fill="#5c4632">guardei.</text>
  </g>

  
  <g transform="translate(120 50) rotate(-8)">
    <rect x="-58" y="-12" width="116" height="22" fill="#f4c430" opacity="0.78"></rect>
    <line x1="-50" y1="-12" x2="-50" y2="10" stroke="#8a6f44" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.55"></line>
    <line x1="50" y1="-12" x2="50" y2="10" stroke="#8a6f44" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.55"></line>
    <rect x="-58" y="-12" width="116" height="22" fill="#000" filter="url(#grain02)" opacity="0.25"></rect>
  </g>
